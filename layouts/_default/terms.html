{{ partial "header.html" . }}
<div class="content-wrapper">
  <h1>{{ .Title }}</h1>
  <main>
    <ul class="term-list">
      {{ range .Data.Terms -}}
      <li class="term-list">
        <a href="{{ .Page.Permalink }}">{{ .Page.Title }}</a> ({{ .Count }})
      </li>
      {{ end -}}
    </ul>
  </main>
</div>

{{ partial "footer.html" . -}}
